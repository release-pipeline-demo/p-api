name: Service Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  test:
    name: test
    uses: release-pipeline-demo/shared-workflows/.github/workflows/ci.yml@main
    with:
      service_name: p-api

  deploy-dev:
    name: Auto-Deploy (Dev)
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: release-pipeline-demo/shared-workflows/.github/workflows/deploy.yml@main
    with:
      service_name: p-api
      environment: dev
      version_ref: ${{ github.sha }}
    secrets: inherit

  deploy-prod:
    name: Release (Prod)
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: release-pipeline-demo/shared-workflows/.github/workflows/deploy.yml@main
    with:
      service_name: p-api
      environment: prod
      version_ref: ${{ github.ref_name }}
    secrets: inherit

  manual-deploy:
    name: Manual Deploy
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    uses: release-pipeline-demo/shared-workflows/.github/workflows/deploy.yml@main
    with:
      service_name: p-api
      environment: ${{ inputs.environment }}
      version_ref: ${{ github.ref_name }}
    secrets: inherit
